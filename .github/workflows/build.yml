name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows,       os: windows-latest }
          - { name: Windows-32bit, os: windows-latest, arch: Win32 }
          - { name: macOS,   os: macos-latest }
          - { name: Linux,   os: ubuntu-24.04 }

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libfreetype-dev libfontconfig1-dev libx11-dev libxcomposite-dev \
            libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libxi-dev libcurl4-openssl-dev \
            mesa-common-dev libglu1-mesa-dev

      - name: Configure
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          elif [ -n "${{ matrix.arch }}" ]; then
            cmake -S . -B build -A "${{ matrix.arch }}"
          else
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          fi

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Check the Windows plugin does not need the VC++ Redistributable
        if: runner.os == 'Windows'
        shell: bash
        run: |
          f=$(find build/LightControl_artefacts/Release/VST3 -name 'LightControl.vst3' -type f)
          echo "Checking $f"
          if grep -a -i -q -E 'vcruntime140|msvcp140' "$f"; then
            echo "The plugin still imports the dynamic VC++ runtime"; exit 1
          fi

      - name: Package for a release
        shell: bash
        run: |
          mkdir -p dist
          # the VST3 folder also holds .lib/.exp files from the Windows linker that nobody needs
          (cd build/LightControl_artefacts/Release/VST3 && cmake -E tar cf "$GITHUB_WORKSPACE/dist/LightControl-VST3-${{ matrix.name }}.zip" --format=zip LightControl.vst3)
          (cd build/LightControl_artefacts/Release/Standalone && cmake -E tar cf "$GITHUB_WORKSPACE/dist/LightControl-Standalone-${{ matrix.name }}.zip" --format=zip $(ls | grep -v -E '\.(lib|exp)$'))

      - name: Upload release packages
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.name }}
          path: dist/
          if-no-files-found: error

      - name: Upload VST3
        uses: actions/upload-artifact@v7
        with:
          name: LightControl-VST3-${{ matrix.name }}
          path: build/LightControl_artefacts/Release/VST3/
          if-no-files-found: error

      - name: Upload Standalone
        uses: actions/upload-artifact@v7
        with:
          name: LightControl-Standalone-${{ matrix.name }}
          path: build/LightControl_artefacts/Release/Standalone/
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'EOF'
          LightControl lights your lights by the DAW transport (red = recording, green = playing, amber = stopped/paused) and shows a lamp on screen. VST3 plugin and standalone app, with OpenRGB and Art-Net support.

          **Install:** unzip `LightControl-VST3-<your system>.zip` (use the `Windows-32bit` one only with a 32-bit DAW) and copy `LightControl.vst3` to your VST3 folder (Windows: `C:\Program Files\Common Files\VST3`, macOS: `~/Library/Audio/Plug-Ins/VST3`, Linux: `~/.vst3`), then rescan plugins in your DAW. The plugin has a built-in Help with the details.

          The builds are not code-signed. Windows may show a SmartScreen warning; on macOS run `xattr -cr LightControl.vst3` once after copying. macOS has not been tested on real hardware.
          EOF
          gh release create "$GITHUB_REF_NAME" dist/*.zip --repo "$GITHUB_REPOSITORY" --title "LightControl $GITHUB_REF_NAME" --notes-file notes.md
